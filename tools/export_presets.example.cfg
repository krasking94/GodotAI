; Пример настроек экспорта для Godot 4.7.2. Настоящий файл export_presets.cfg в репозиторий не попадает
; (он в .gitignore: в нём могут быть пути к ключам подписи). `enginectl project export` создаёт его
; из этого примера, если файла ещё нет. Правится и в редакторе: Проект → Экспорт.

[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="*.md, docs/*, tools/*, addons/*, *.py"
export_path="build/windows/GodotAI.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=true
application/modify_resources=false
application/console_wrapper_icon=""
application/icon=""
application/file_version=""
application/product_version=""
application/company_name="GodotAI"
application/product_name="GodotAI"
application/file_description="Демо движка GodotAI"
application/copyright=""
application/trademarks=""

[preset.1]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="*.md, docs/*, tools/*, addons/*, *.py"
export_path="build/linux/GodotAI.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=true

[preset.2]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="*.md, docs/*, tools/*, addons/*, *.py"
export_path="build/android/GodotAI.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.2.options]

gradle_build/use_gradle_build=false
gradle_build/export_format=0
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1"
package/unique_name="ru.godotai.demo"
package/name="GodotAI"
package/signed=true
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
permissions/internet=false
